# Hermes 承载聊天时的组合层。
#
# 只在 chatBackend 为 hermes 时由 profile 加入，叠加在 bundle-hosted 之上。
# 渠道会话没有活动 Agent，审批不能走上游的 approval/request，因此把审批行切到
# 自建应答链；Hermes 的审批请求由 chatdsh-chat-hermes 写成 plugin 记录并回传。

- insert:
    - id: chatdsh-chat-hermes
      name: '@chatdsh/host-chat-hermes'
      config:
        baseUrl: http://127.0.0.1:50011
        apiKeyEnv: HERMES_API_KEY
        requestTimeoutMs: 120000
        approvalTimeoutMs: 300000
        modelLabel: hermes-0.21.7

# 审批由自建链路接管；宿主自带的 approval/request 在渠道会话里没有应答者。
- id: chatdsh-approval
  config:
    takeOver: true
    answerTimeoutMs: 300000
