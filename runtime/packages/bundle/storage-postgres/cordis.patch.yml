# 会话日志切到 PostgreSQL：禁用 JSONL 行，插入 Postgres 后端。
# 连接串只从环境变量读，不写进配置值。
- id: session-persistence-jsonl
  disabled: true

- insert:
    - id: session-persistence-postgres
      name: '@chatdsh/core-session-persistence-postgres'
      config:
        connectionString: !!js process.env.CHATDSH_POSTGRES_URL
        schema: public
