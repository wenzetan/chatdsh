# ChatDSH 桌面组合包。
#
# 浏览器侧栏这一行按 profile 名判断是否保留：名字为 `desktop` 时保留，其余形态关闭。
# ChatDSH 的桌面 profile 叫 `chatdsh-desktop`，因此在这里显式启用，桌面窗口里仍然有侧栏。
#
# 桌面原生的审批呈现由壳层承担：控制平面把审批请求经长连接送到窗口，用户在窗口里应答，
# 应答走同一条审批链路。这一层不需要新行，审批策略仍由 `approval` 行的配置决定。

- id: ui-sidebar-browser
  name: '@deepseek-ai/dsh-client-ui-sidebar-browser'
  disabled: false
