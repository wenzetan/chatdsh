# @chatdsh/preset-chat 的补丁层：声明会话平面使用的三档 agent preset。
#
# 预设内的条目属于会话作用域，与会话一起创建与销毁；工具可见范围由预设差异与
# ctx.tools.restrict 收敛。宿主平面已经注册的行在这里重新挂载到会话作用域，
# 两层的行 id 各自独立。
#
# 三档的分工：
#   chatdsh-chat  聊天档，只有网页抓取、任务清单与会话检索，不带文件与命令。
#   chatdsh-work  工作档，默认档位，文件与命令齐备，native 形态一次全量声明。
#   chatdsh-full  全量档，在工作档之上补子代理、工作树、定时、目标与浏览器操作，
#                 走 ptc 形态：模型只看到单个 run_code 加一份生成的 SDK，声明列表不随
#                 工具条目数增长，上下文占用与缓存前缀因此稳定。
#
# ptc 档依赖宿主平面的 ptc-runtime 行（dsh-base 已挂载）。缺它时该档在挂载阶段
# 失败并出现在预设名册的诊断里，不会拖累另外两档。

- insert:
    # 聊天档。
    - id: preset-chatdsh-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chatdsh-chat
        name: ChatDSH 聊天
        description: 轻量工具面：网页抓取、任务清单与会话检索，不含文件读写与命令执行。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 ChatDSH 的助手，一个自托管助手。
                需要查资料时使用网页抓取工具，需要记录多步进度时使用任务清单工具。
                只报告实际执行过的操作与实际的执行结果，不确定的事情明确说明不确定。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'

    # 工作档：默认档位。
    - id: preset-chatdsh-work
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chatdsh-work
        name: ChatDSH 工作
        description: 默认工具面：文件读写、命令执行、内容检索、任务清单、制品与项目记录。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 ChatDSH 的助手，一个可以读写文件、运行命令、检索与会话内容的自托管助手。
                需要查看文件内容时读取文件，不要凭印象猜测；需要运行命令时直接运行，不要只给出命令文本。
                多步任务先用任务清单工具列出步骤，完成一步就更新一步。
                只报告实际执行过的操作与实际的执行结果，不确定的事情明确说明不确定。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: chatdsh-tool-artifact
            name: '@chatdsh/tool-artifact'
          - id: chatdsh-tool-project
            name: '@chatdsh/tool-project'
          - id: chatdsh-tool-share
            name: '@chatdsh/tool-share'
          - id: chatdsh-tool-connector
            name: '@chatdsh/tool-connector'
          - id: chatdsh-tool-research
            name: '@chatdsh/tool-research'
          - id: chatdsh-tool-image
            name: '@chatdsh/tool-image'
          - id: chatdsh-tool-skill-manage
            name: '@chatdsh/tool-skill-manage'

    # 全量档：PTC 形态。
    - id: preset-chatdsh-full
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chatdsh-full
        name: ChatDSH 全量
        description: 全量工具面：在工作档之上补子代理、工作树、定时、目标、结构化提问与浏览器操作，以 PTC 形态呈现。
        order: 7
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 ChatDSH 的助手，一个可以读写文件、运行命令、检索与会话内容的自托管助手。
                需要查看文件内容时读取文件，不要凭印象猜测；需要运行命令时直接运行，不要只给出命令文本。
                多步任务先用任务清单工具列出步骤，完成一步就更新一步。
                只报告实际执行过的操作与实际的执行结果，不确定的事情明确说明不确定。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-str-replace-editor
            name: '@deepseek-ai/dsh-tool-str-replace-editor'
          - id: tool-terminal
            name: '@deepseek-ai/dsh-tool-terminal'
          - id: tool-working-directory
            name: '@deepseek-ai/dsh-tool-working-directory'
          - id: tool-workspace-dependencies
            name: '@deepseek-ai/dsh-tool-workspace-dependencies'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-worktree
            name: '@deepseek-ai/dsh-experimental-tool-worktree'
          - id: chatdsh-tool-artifact
            name: '@chatdsh/tool-artifact'
          - id: chatdsh-tool-project
            name: '@chatdsh/tool-project'
          - id: chatdsh-tool-share
            name: '@chatdsh/tool-share'
          - id: chatdsh-tool-connector
            name: '@chatdsh/tool-connector'
          - id: chatdsh-tool-research
            name: '@chatdsh/tool-research'
          - id: chatdsh-tool-image
            name: '@chatdsh/tool-image'
          - id: chatdsh-tool-skill-manage
            name: '@chatdsh/tool-skill-manage'
          - id: chatdsh-tool-browser
            name: '@chatdsh/tool-browser'
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
