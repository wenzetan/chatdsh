# chatdsh-desktop 的本部署补丁层。
#
# 桌面形态与 Web 形态共用界面，差别在组合包：storage-jsonl 显式钉住会话日志位置，
# bundle-desktop 保留浏览器侧栏并声明审批呈现由壳层承担。

# 会话检索：跨会话搜索与按工作区过滤走这一行。
# 这一行已由 Web 应用在配置里注册，这里覆盖它的配置，不能再插入一次同名条目。
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js dshHomePath('session-index.sqlite')
    openAt: startup

# 新会话默认使用工作档；三档标识由 @chatdsh/core-contracts 的 tool-tiers 声明。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: chatdsh-work

# 浏览器侧的客户端插件。
#
# 这些行必须落在 profile 自己的补丁层：客户端模块图按 loader 条目的来源目录解析包元数据，
# 组合包插入的行会以组合包所在目录为基准，而自建包只安装在 profile 的 node_modules 里。
#
# 同样的行在 chatdsh-web 里也有一份，重复是有意的：补丁层不能跨 profile 复用，搬进组合包
# 会让上面那条路径解析失效。
- insert:
    - id: chatdsh-client-telemetry
      name: '@chatdsh/client-telemetry'
    - id: chatdsh-client-projects
      name: '@chatdsh/client-projects'
    - id: chatdsh-client-artifacts
      name: '@chatdsh/client-artifacts'
    - id: chatdsh-client-assistants
      name: '@chatdsh/client-assistants'
    - id: chatdsh-client-share
      name: '@chatdsh/client-share'
    - id: chatdsh-client-account
      name: '@chatdsh/client-account'
    - id: chatdsh-client-memory
      name: '@chatdsh/client-memory'
    - id: chatdsh-client-approval
      name: '@chatdsh/client-approval'
    - id: chatdsh-client-connectors
      name: '@chatdsh/client-connectors'
    - id: chatdsh-client-model-provider
      name: '@chatdsh/client-model-provider'
    - id: chatdsh-client-context-insights
      name: '@chatdsh/client-context-insights'
    - id: chatdsh-client-skills
      name: '@chatdsh/client-skills'
    - id: chatdsh-client-automation
      name: '@chatdsh/client-automation'
    - id: chatdsh-client-workspace-tools
      name: '@chatdsh/client-workspace-tools'
    - id: chatdsh-client-notifications
      name: '@chatdsh/client-notifications'
    - id: chatdsh-client-data-management
      name: '@chatdsh/client-data-management'
    - id: chatdsh-client-exports
      name: '@chatdsh/client-exports'
    - id: chatdsh-client-pwa
      name: '@chatdsh/client-pwa'
    - id: chatdsh-client-desktop-control
      name: '@chatdsh/client-desktop-control'
    - id: chatdsh-client-access
      name: '@chatdsh/client-access'

# 单机形态不接 DeepSeek 官方账号链，模型凭据由设置页或环境变量提供。
- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: account-controller
  disabled: true

- id: ui-settings-account
  disabled: true

- id: web-deepseek-api
  disabled: true

- id: web-search-deepseek
  disabled: true

# 自定义模型提供方：OpenAI 兼容端点。三项环境变量齐全时接管默认模型。
# 密钥只以变量名进入配置，值留在进程环境里，不落 profile 或数据目录。
#   CHATDSH_PROVIDER_URL       端点基地址，例如 https://provider.example/v1（不要带 /chat/completions）
#   CHATDSH_PROVIDER_API_KEY   密钥值所在的变量名固定为本变量
#   CHATDSH_PROVIDER_MODEL     模型 id
#   CHATDSH_PROVIDER_API       可选，协议，默认 openai-completions
#   CHATDSH_PROVIDER_NAME      可选，模型选择器里的展示名
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js >-
      process.env.CHATDSH_PROVIDER_URL && process.env.CHATDSH_PROVIDER_MODEL
        ? { chatdsh: { displayName: process.env.CHATDSH_PROVIDER_NAME ?? "ChatDSH Provider", ...(process.env.CHATDSH_PROVIDER_API_KEY ? { apiKeyEnv: "CHATDSH_PROVIDER_API_KEY" } : {}), api: process.env.CHATDSH_PROVIDER_API ?? "openai-completions", baseURL: process.env.CHATDSH_PROVIDER_URL, models: [{ id: process.env.CHATDSH_PROVIDER_MODEL, name: process.env.CHATDSH_PROVIDER_MODEL }] } }
        : {}

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: !!js "process.env.CHATDSH_PROVIDER_URL && process.env.CHATDSH_PROVIDER_MODEL ? 'chatdsh' : 'deepseek-official'"
    model: !!js "process.env.CHATDSH_PROVIDER_URL && process.env.CHATDSH_PROVIDER_MODEL ? process.env.CHATDSH_PROVIDER_MODEL : 'deepseek-flash'"

# 主题插件：把界面基础设计的令牌与样式带给上游外壳。
# `immediately` 让它在启动早期挂样式，首次绘制就落到本设计的画布与色调上。
- insert:
    - id: chatdsh-client-theme
      name: '@chatdsh/client-theme'

# 预览版欢迎说明已经通过本部署的配置确认，避免首次启动时因设置写入失败卡在提示框。
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1

