# chatdsh-web 的本部署补丁层：在每个组合包层之后应用，最后写者胜出。
#
# 这里只写本部署的差异：会话检索、按形态禁用不需要的宿主行。通用能力在
# @chatdsh/bundle-hosted 的补丁层里，不在这里重复。
#
# 补丁覆盖整行 config，每行必须重述它拥有的全部键；`name` 是匹配校验条件，写错会跳过整条补丁。

# 会话检索打开。默认组合把它设成 `never`：那时只保留精确读取与过滤，不导入 SQLite。
# ChatDSH 的会话列表与检索都依赖它，因此把打开时机改回 activation。
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js dshHomePath('session-index.sqlite')
    openAt: startup

# 新会话默认使用工作档；三档标识由 @chatdsh/core-contracts 的 tool-tiers 声明。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: chatdsh-work

# 浏览器侧的客户端插件。
#
# 这一行必须落在 profile 自己的补丁层：客户端模块图按 loader 条目的来源目录解析包元数据，
# 组合包插入的行会以组合包所在目录为基准，而自建包只安装在 profile 的 node_modules 里。
#
# 同样的行在 chatdsh-desktop 里重复出现是有意的：补丁层不能跨 profile 复用，搬进组合包
# 会让上面那条路径解析失效。
- insert:
    - id: chatdsh-client-telemetry
      name: '@chatdsh/client-telemetry'
    - id: chatdsh-client-projects
      name: '@chatdsh/client-projects'
    - id: chatdsh-client-artifacts
      name: '@chatdsh/client-artifacts'
    - id: chatdsh-client-assistants
      name: '@chatdsh/client-assistants'
    - id: chatdsh-client-share
      name: '@chatdsh/client-share'
    - id: chatdsh-client-account
      name: '@chatdsh/client-account'
    - id: chatdsh-client-memory
      name: '@chatdsh/client-memory'
    - id: chatdsh-client-approval
      name: '@chatdsh/client-approval'
    - id: chatdsh-client-connectors
      name: '@chatdsh/client-connectors'
    - id: chatdsh-client-model-provider
      name: '@chatdsh/client-model-provider'
    - id: chatdsh-client-context-insights
      name: '@chatdsh/client-context-insights'
    - id: chatdsh-client-skills
      name: '@chatdsh/client-skills'
    - id: chatdsh-client-automation
      name: '@chatdsh/client-automation'
    - id: chatdsh-client-workspace-tools
      name: '@chatdsh/client-workspace-tools'
    - id: chatdsh-client-notifications
      name: '@chatdsh/client-notifications'
    - id: chatdsh-client-data-management
      name: '@chatdsh/client-data-management'
    - id: chatdsh-client-exports
      name: '@chatdsh/client-exports'
    - id: chatdsh-client-pwa
      name: '@chatdsh/client-pwa'
    - id: chatdsh-client-desktop-control
      name: '@chatdsh/client-desktop-control'
    - id: chatdsh-client-access
      name: '@chatdsh/client-access'

# 账号链六行整体禁用。DSH 自带的那套登录、余额与充值接缝绑定 DeepSeek 平台账号，
# ChatDSH 的账号由控制平面承担，运行时内的授权层恒为 owner，因此这条链不挂载。
# 六个包互相引用，必须整链处理，只停其中几行会留下失败的 fiber。
- id: deepseek-account
  name: '@deepseek-ai/dsh-deepseek-account-platform'
  disabled: true

- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  disabled: true

- id: account-controller
  name: '@deepseek-ai/dsh-api-account-controller'
  disabled: true

- id: ui-settings-account
  name: '@deepseek-ai/dsh-client-ui-settings-account'
  disabled: true

- id: web-deepseek-api
  name: '@deepseek-ai/dsh-web-deepseek-api'
  disabled: true

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# 模型路由器：把网关 provider 接管过来，默认模型改选它。
#
# 入口地址取控制平面同机的回环地址，端口与控制平面的 CHATDSH_GATEWAY_PORT 一致，
# 未设置时按控制平面缺省的 3170。运行时是控制平面的子进程，继承同一个环境变量。
# 账号取运行时注入的身份头部，入口侧按账号累计额度。
# 上游测试网关地址与密钥由控制平面的 CHATDSH_LLM_GATEWAY_URL 与 CHATDSH_LLM_API_KEY_ENV
# 给出；额度上限由 CHATDSH_LLM_QUOTA_LIMIT 给出，留空表示不限制。
- id: chatdsh-llm-router
  name: '@chatdsh/host-llm-router'
  config:
    baseUrl: !!js "'http://127.0.0.1:' + (process.env.CHATDSH_GATEWAY_PORT ?? '3170') + '/chatdsh/gateway/llm'"
    routes:
      - provider: gateway

# 自定义模型提供方：OpenAI 兼容端点。三项环境变量齐全时接管默认模型，缺省仍走网关。
# 密钥只以变量名进入配置，值留在进程环境里，不落 profile 或数据目录。
#   CHATDSH_PROVIDER_URL       端点基地址，例如 https://provider.example/v1（不要带 /chat/completions）
#   CHATDSH_PROVIDER_API_KEY   密钥值所在的变量名固定为本变量
#   CHATDSH_PROVIDER_MODEL     模型 id
#   CHATDSH_PROVIDER_API       可选，协议，默认 openai-completions
#   CHATDSH_PROVIDER_NAME      可选，模型选择器里的展示名
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js >-
      process.env.CHATDSH_PROVIDER_URL && process.env.CHATDSH_PROVIDER_MODEL
        ? { chatdsh: { displayName: process.env.CHATDSH_PROVIDER_NAME ?? "ChatDSH Provider", ...(process.env.CHATDSH_PROVIDER_API_KEY ? { apiKeyEnv: "CHATDSH_PROVIDER_API_KEY" } : {}), api: process.env.CHATDSH_PROVIDER_API ?? "openai-completions", baseURL: process.env.CHATDSH_PROVIDER_URL, models: [{ id: process.env.CHATDSH_PROVIDER_MODEL, name: process.env.CHATDSH_PROVIDER_MODEL }] } }
        : {}

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: !!js "process.env.CHATDSH_PROVIDER_URL && process.env.CHATDSH_PROVIDER_MODEL ? 'chatdsh' : 'gateway'"
    model: !!js "process.env.CHATDSH_PROVIDER_URL && process.env.CHATDSH_PROVIDER_MODEL ? process.env.CHATDSH_PROVIDER_MODEL : 'xhs/dots3-note-prev'"

# MCP 服务端：设计保留，本部署不打开。
#
# 它把本执行器的工具目录暴露给外部程序，属于能力出口；当前没有消费方，因此保持关闭。
# 需要时把 enabled 改成 true，并给出访问令牌所在的环境变量名。
# 连接器：MCP 注册表从控制平面拉取，按本设备那段生成 DSH 原生 MCP 客户端行。
# deviceId 与 chatdsh-push 用的是同一台设备的标识，可由部署环境覆盖。
- id: chatdsh-connectors
  name: '@chatdsh/host-connectors'
  config:
    gatewayUrl: !!js "'http://127.0.0.1:' + (process.env.CHATDSH_GATEWAY_PORT ?? '3170')"
    deviceId: !!js process.env.CHATDSH_MCP_DEVICE_ID ?? 'local'

- id: chatdsh-mcp-server
  name: '@chatdsh/host-mcp-server'
  config:
    enabled: false

# 主题插件：把界面基础设计的令牌与样式带给上游外壳。
# `immediately` 让它在启动早期挂样式，首次绘制就落到本设计的画布与色调上。
- insert:
    - id: chatdsh-client-theme
      name: '@chatdsh/client-theme'

# 移动端网关插件：手机经控制平面接入，运行时不直接对外监听。
#
# 边界划分：控制平面是手机的唯一入口，负责配对、设备令牌与吊销；插件只在本机回环上
# 提供 /ws/mobile，供控制平面转发。插件自身的设备鉴权关闭（requireAuth: false），
# 因为控制平面的转发请求没有插件侧凭证；鉴权落在控制平面上，每个 HTTP 请求与每次
# WebSocket 升级都校验设备令牌，令牌只存 SHA-256 摘要，吊销后立即失效。
#
# lanEnabled 关闭，插件不开独立局域网监听；公网与局域网访问都只经控制平面。
#
# deviceFile 与 gatewayStateFile 必须落在数据根下：插件缺省会写到 os.homedir()/.dsh，
# 在只读主目录下会让整条插件行不激活（日志表现为 "1 entry did not activate"）。
- insert:
    - id: mobile-gateway
      name: 'dsh-plugin-mobile-gateway'
      config:
        gatewayEnabled: true
        gatewayMode: persistent
        requireAuth: false
        adminLoopbackOnly: true
        lanEnabled: false
        path: '/ws/mobile'
        deviceFile: !!js dshHomePath('mobile-gateway/devices.json')
        gatewayStateFile: !!js dshHomePath('mobile-gateway/state.json')
        gatewayWaitTimeoutMs: 300000
        pairingTtlMs: 300000
