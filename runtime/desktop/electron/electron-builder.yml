# Windows 便携版的打包配置。
#
# 壳本身很小；随包的 DSH 安装与 desktop profile 由 scripts/build-desktop-windows.mjs
# 暂存到 CHATDSH_DESKTOP_STAGE，再通过 extraResources 放到 resources/app/dsh。
# 这样 main.mjs 的 resolveDshBin 能直接用 resources/app/dsh/lib/bin.js 启动运行时。

appId: com.chatdsh.desktop
productName: ChatDSH
copyright: Copyright © ChatDSH
asar: true
compression: normal
npmRebuild: false
directories:
  output: ../../.run/desktop-windows
files:
  - main.mjs
  - launch.mjs
  - preload.cjs
  - splash.html
  - splash-preload.cjs
  - telemetry.mjs
  - gateway-launch.mjs
  - ipc.mjs
  - login-item.mjs
  - menu.mjs
  - native.mjs
  - notifications.mjs
  - power.mjs
  - signals.mjs
  - startup-recovery.mjs
  - tray.mjs
  - updates.mjs
  - window-state.mjs
  - recovery.html
  - recovery-preload.cjs
  - windows/**/*
  - control/**/*
  - package.json
extraResources:
  # 第一项放 DSH 安装本身；electron-builder 会过滤掉源根下的 node_modules，
  # 因此把 node_modules 单独作为第二项复制到同一目标。
  - from: ${env.CHATDSH_DESKTOP_STAGE}/app/dsh
    to: app/dsh
  - from: ${env.CHATDSH_DESKTOP_STAGE}/app/dsh/node_modules
    to: app/dsh/node_modules
win:
  target:
    - target: portable
      arch:
        - x64
  # 跨平台构建时不执行 rcedit/signtool，避免依赖 wine；产物未签名，仅用于本地分发。
  signAndEditExecutable: false
portable:
  artifactName: ChatDSH-${version}-x64.${ext}
