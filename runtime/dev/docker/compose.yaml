# ChatDSH 开发环境：dsh 运行时、Hermes、Hindsight 与 Hindsight 的 Postgres。
#
# 四个服务都跑在容器里，宿主上已经在跑的实例（3080/8642/8889/20128）不受影响：
# 容器侧的端口全部换到 13080、18642、18889，只绑定宿主回环地址。
#
# 密钥与地址一律从环境变量读，文件里不出现真实值。变量清单见 ../.env.example。
# 用法：在仓库根执行 docker compose --env-file dev/.env -f dev/docker/compose.yaml up -d
# （--env-file 的路径相对当前目录，这里指向 dev 目录下的变量文件）

name: chatdsh-dev

services:
  dsh-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: "${DSH_VERSION:-0.2.1-rc.2}"
        PNPM_VERSION: "${PNPM_VERSION:-10.33.0}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    image: "chatdsh-dev-dsh:${DSH_VERSION:-0.2.1-rc.2}"
    init: true
    environment:
      DSH_HOME: /work/.dsh
      DSH_BIND_HOST: "${DSH_BIND_HOST:-}"
      CHATDSH_TEST_GATEWAY_URL: "${CHATDSH_TEST_GATEWAY_URL:-}"
      CHATDSH_TEST_GATEWAY_API_KEY: "${CHATDSH_TEST_GATEWAY_API_KEY:-}"
      CHATDSH_TEST_GATEWAY_MODEL: "${CHATDSH_TEST_GATEWAY_MODEL:-}"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - "${CHATDSH_WORKSPACE:-/workspace/chatdsh}:/src:ro"
      - "dsh-work:/work"
    ports:
      - "127.0.0.1:${DSH_HOST_PORT:-13080}:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://$(hostname -i | awk '{print $1}'):3080/ | grep -qE '^(200|401)$'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  hermes:
    image: "${HERMES_IMAGE:-nousresearch/hermes-agent:latest}"
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_KEY: "${HERMES_API_KEY:-example-hermes-api-key}"  # gitleaks:allow
      # api_server 默认只绑容器内的回环地址，宿主的端口映射连不上。绑到容器的所有接口，
      # 端口映射只发布到宿主回环地址 18642，外部网络仍不可达。
      API_SERVER_HOST: "0.0.0.0"
      CHATDSH_TEST_GATEWAY_URL: "${CHATDSH_TEST_GATEWAY_URL:-}"
      CHATDSH_TEST_GATEWAY_API_KEY: "${CHATDSH_TEST_GATEWAY_API_KEY:-}"
      CHATDSH_TEST_GATEWAY_MODEL: "${CHATDSH_TEST_GATEWAY_MODEL:-}"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - "hermes-data:/opt/data"
      - "./hermes-init.sh:/opt/hermes-init/hermes-init.sh:ro"
    ports:
      - "127.0.0.1:${HERMES_HOST_PORT:-18642}:8642"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "/opt/hermes-init/hermes-init.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  hindsight:
    image: "${HINDSIGHT_IMAGE:-ghcr.nju.edu.cn/vectorize-io/hindsight:0.9.2}"
    command: ["/app/start-all.sh"]
    depends_on:
      hindsight-db:
        condition: service_healthy
    environment:
      HINDSIGHT_API_HOST: "0.0.0.0"
      HINDSIGHT_API_PORT: "8889"
      HINDSIGHT_ENABLE_API: "true"
      HINDSIGHT_ENABLE_CP: "false"
      HINDSIGHT_API_DATABASE_URL: "postgresql://${HINDSIGHT_DB_USER:-hindsight}:${HINDSIGHT_DB_PASSWORD:-example-hindsight-db-password}@hindsight-db:5432/${HINDSIGHT_DB_NAME:-hindsight}"  # gitleaks:allow
      HINDSIGHT_API_VECTOR_EXTENSION: "vchord"
      HINDSIGHT_API_LLM_PROVIDER: "${HINDSIGHT_LLM_PROVIDER:-openai}"
      HINDSIGHT_API_LLM_BASE_URL: "${HINDSIGHT_LLM_BASE_URL:-http://host.docker.internal:20128/v1}"
      HINDSIGHT_API_LLM_MODEL: "${HINDSIGHT_LLM_MODEL:-}"
      HINDSIGHT_API_LLM_API_KEY: "${HINDSIGHT_LLM_API_KEY:-}"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: "${HINDSIGHT_EMBEDDINGS_PROVIDER:-openai}"
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: "${HINDSIGHT_EMBEDDINGS_BASE_URL:-}"
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: "${HINDSIGHT_EMBEDDINGS_MODEL:-}"
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: "${HINDSIGHT_EMBEDDINGS_API_KEY:-}"
    env_file:
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:${HINDSIGHT_HOST_PORT:-18889}:8889"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8889/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  hindsight-db:
    image: "${HINDSIGHT_DB_IMAGE:-docker.1panel.live/tensorchord/vchord-postgres:pg18-v1.1.1}"
    command: ["postgres", "-c", "shared_preload_libraries=vchord,vector"]
    environment:
      POSTGRES_USER: "${HINDSIGHT_DB_USER:-hindsight}"
      POSTGRES_PASSWORD: "${HINDSIGHT_DB_PASSWORD:-example-hindsight-db-password}"  # gitleaks:allow
      POSTGRES_DB: "${HINDSIGHT_DB_NAME:-hindsight}"
    volumes:
      - "hindsight-db-data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HINDSIGHT_DB_USER:-hindsight} -d ${HINDSIGHT_DB_NAME:-hindsight}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  dsh-work:
  hermes-data:
  hindsight-db-data:
