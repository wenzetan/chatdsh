# 验收 profile：ACP 形态没有 Web 服务器与预设注册表，依赖这两者的行在这里关掉。
- id: chatdsh-telemetry
  disabled: true

- id: chatdsh-assistants
  disabled: true

# 上报在这一形态里照常工作，但把间隔压短，端到端验证不必等待默认的 2 秒。
- id: chatdsh-push
  name: '@chatdsh/host-push'
  config:
    enabled: true
    gatewayUrl: http://127.0.0.1:3170
    flushIntervalMs: 500
    batchSize: 64
    deviceId: acp-e2e

# 测试模型网关。密钥从环境变量读，不写进配置。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      test-gateway:
        apiKeyEnv: CHATDSH_TEST_GATEWAY_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:20128/v1
        models:
          - id: xhs/dots3-note-prev
            name: 测试模型
            contextWindow: 131072
            maxTokens: 4096

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: test-gateway
    model: xhs/dots3-note-prev

# ACP 入口的默认模型沿用组合层里的 deepseek-official；联调 profile 改到测试网关。
- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: test-gateway
    model: xhs/dots3-note-prev

# 记忆写入联调：指向宿主上运行的 Hindsight。
- id: chatdsh-memory
  name: '@chatdsh/host-memory'
  config:
    hindsightUrl: http://127.0.0.1:8889
    maxTokens: 1024
    requestTimeoutMs: 5000
    mirrorToOwnBank: false
    additionalBanks: []
    summaryProvider: test-gateway
    summaryModel: xhs/dots3-note-prev
