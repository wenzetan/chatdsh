# chatdsh-web 的本部署补丁层：在每个组合包层之后应用，最后写者胜出。
#
# 这里只写本部署的差异：会话检索、按形态禁用不需要的宿主行。通用能力在
# @chatdsh/bundle-hosted 的补丁层里，不在这里重复。
#
# 补丁覆盖整行 config，每行必须重述它拥有的全部键；`name` 是匹配校验条件，写错会跳过整条补丁。

# 会话检索打开。默认组合把它设成 `never`：那时只保留精确读取与过滤，不导入 SQLite。
# ChatDSH 的会话列表与检索都依赖它，因此把打开时机改回 activation。
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js dshHomePath('session-index.sqlite')
    openAt: startup

# 新会话默认使用 ChatDSH 自己的预设。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: chatdsh

# 浏览器侧的客户端插件。
#
# 这一行必须落在 profile 自己的补丁层：客户端模块图按 loader 条目的来源目录解析包元数据，
# 组合包插入的行会以组合包所在目录为基准，而自建包只安装在 profile 的 node_modules 里。
#
# 同样的行在 chatdsh-desktop 里重复出现是有意的：补丁层不能跨 profile 复用，搬进组合包
# 会让上面那条路径解析失效。
- insert:
    - id: chatdsh-client-telemetry
      name: '@chatdsh/client-telemetry'
    - id: chatdsh-client-projects
      name: '@chatdsh/client-projects'
    - id: chatdsh-client-artifacts
      name: '@chatdsh/client-artifacts'
    - id: chatdsh-client-assistants
      name: '@chatdsh/client-assistants'
    - id: chatdsh-client-share
      name: '@chatdsh/client-share'
    - id: chatdsh-client-account
      name: '@chatdsh/client-account'
    - id: chatdsh-client-memory
      name: '@chatdsh/client-memory'
    - id: chatdsh-client-approval
      name: '@chatdsh/client-approval'
    - id: chatdsh-client-connectors
      name: '@chatdsh/client-connectors'

# 账号链六行整体禁用。DSH 自带的那套登录、余额与充值接缝绑定 DeepSeek 平台账号，
# ChatDSH 的账号由控制平面承担，运行时内的授权层恒为 owner，因此这条链不挂载。
# 六个包互相引用，必须整链处理，只停其中几行会留下失败的 fiber。
- id: deepseek-account
  name: '@deepseek-ai/dsh-deepseek-account-platform'
  disabled: true

- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  disabled: true

- id: account-controller
  name: '@deepseek-ai/dsh-api-account-controller'
  disabled: true

- id: ui-settings-account
  name: '@deepseek-ai/dsh-client-ui-settings-account'
  disabled: true

- id: web-deepseek-api
  name: '@deepseek-ai/dsh-web-deepseek-api'
  disabled: true

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# 联调桥：把页面里的 remote 对象暴露到全局，供 CDP 调用。
- insert:
    - id: chatdsh-e2e-remote-bridge
      name: '@chatdsh/e2e-client-remote-bridge'

# 用测试网关代替 DeepSeek 官方端点，让首次引导能通过。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: http://127.0.0.1:20128/v1
    thinking: enabled
    reasoningEffort: max
