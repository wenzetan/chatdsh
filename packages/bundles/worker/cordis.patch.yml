# ChatDSH 长任务组合包。
#
# 长任务会话的关键资源是上下文：跑得越久，工具输出越容易把窗口挤满。这里把两条阈值按形态
# 调开——更多结果落盘进 spill，模型侧只留一小段；同时把压缩前的保留量提高，避免一次长
# 输出被过早截断。补丁覆盖整行 config，因此每行都重述它拥有的全部键。

- id: spill-policy
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    maxInlineTokens: 4000

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 32768
    headChars: 16384
