name: Build & Publish Relay Image and Plugin Bundle

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：自定义发布标签（留空在 main 上更新 rolling 发布 latest）'
        required: false
        type: string

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-image:
    name: Build & Push Relay Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chatdsh-relay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plugin-bundle:
    name: Build & Publish Plugin Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm 11.21.0
        uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'

      - name: Install official DSH baseline globally
        run: npm install -g @deepseek-ai/dsh@latest && dsh --version

      - name: Build and test @chatdsh/adapter
        working-directory: dsh-adapter
        run: |
          pnpm install --config.registry=https://registry.npmjs.org --no-frozen-lockfile
          node scripts/link-dsh-deps.mjs
          pnpm build
          pnpm test

      - name: Build runtime packages and client bundles
        working-directory: runtime
        run: |
          pnpm install --config.registry=https://registry.npmjs.org --no-frozen-lockfile
          node scripts/link-dsh-deps.mjs
          pnpm build
          pnpm build:client
          pnpm check:telemetry
          pnpm check:plugins
          node scripts/check-upstream-names.mjs
          pnpm check:layering

      - name: Pack self-contained plugin bundle archive
        run: node scripts/pack-plugin-bundle.mjs --out-dir dist/plugin-bundle

      - name: Smoke test plugin archive installation
        run: |
          SMOKE_HOME="$(mktemp -d "${RUNNER_TEMP}/chatdsh-smoke.XXXXXX")"
          DSH_HOME="$SMOKE_HOME" bash scripts/device-join.sh \
            --bundle-archive dist/plugin-bundle/chatdsh-plugin-bundle.tar.gz \
            --install-only
          DSH_HOME="$SMOKE_HOME" dsh --profile web --dump-config >/dev/null
          rm -rf "$SMOKE_HOME"

      - name: Upload plugin bundle workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatdsh-plugin-bundle
          path: |
            dist/plugin-bundle/chatdsh-plugin-bundle.tar.gz
            dist/plugin-bundle/SHA256SUMS.txt
          retention-days: 30

      - name: Publish plugin bundle to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
            TITLE="ChatDSH ${TAG}"
            IS_ROLLING=0
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="ChatDSH ${TAG}"
            IS_ROLLING=0
          else
            TAG="latest"
            TITLE="ChatDSH Latest Build"
            IS_ROLLING=1
          fi

          if [ "$IS_ROLLING" -eq 1 ]; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/${TAG}"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="$(printf '%s\n\n%s\n%s\n' \
            "Automated build for commit \`${SHORT_SHA}\`." \
            "- **Relay Docker Image**: \`ghcr.io/${{ github.repository_owner }}/chatdsh-relay:latest\`" \
            "- **Plugin Bundle Archive**: \`chatdsh-plugin-bundle.tar.gz\` (verified with \`SHA256SUMS.txt\`)")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/plugin-bundle/chatdsh-plugin-bundle.tar.gz \
              dist/plugin-bundle/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$TAG" \
              dist/plugin-bundle/chatdsh-plugin-bundle.tar.gz \
              dist/plugin-bundle/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
