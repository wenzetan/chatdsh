# 独立 Postgres：存储后端联调（bundle-storage-postgres 与部署文档里的接缝）。
#
# 它与 Hindsight 的数据库分开：Hindsight 需要 vchord 扩展，这个只需要干净的标准 Postgres。
# 宿主端口 50031，数据落在 deploy/data/postgres。

name: chatdsh-test

services:
  postgres:
    image: "${CHATDSH_DB_IMAGE:-postgres:18}"
    environment:
      POSTGRES_USER: "${CHATDSH_DB_USER:-chatdsh}"
      POSTGRES_PASSWORD: "${CHATDSH_DB_PASSWORD:?deploy/.env 里必须设置 CHATDSH_DB_PASSWORD}"
      POSTGRES_DB: "${CHATDSH_DB_NAME:-chatdsh}"
    volumes:
      - "./data/postgres:/var/lib/postgresql"
      - "./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro"
    ports:
      - "127.0.0.1:50031:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHATDSH_DB_USER:-chatdsh} -d ${CHATDSH_DB_NAME:-chatdsh}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
